<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>奇門遁甲 · 行動指引</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap');

:root {
  --bg:#09090f;--surface:#0f0f1a;--panel:#131320;--panel2:#17172a;
  --border:#222238;--border2:#2e2e50;
  --gold:#c8a84a;--gold2:#e8d080;--gold-dim:#7a6420;
  --red:#b83030;--teal:#18b090;--teal2:#25d4ac;
  --blue:#4a8cc8;--purple:#8870c8;
  --text:#e0d8c8;--text2:#a0987c;--muted:#505068;
  --yang:#d88040;--yin:#6090c0;
  --qi-clr:#e8b830;--yi-clr:#7aaccf;--kong-clr:#b03030;
  --ai-user:#141c2a;--ai-bot:#0d1520;
  /* 五行色 */
  --wood:#38b848;--fire:#e85030;--earth:#c89820;
  --metal:#90c0e0;--water:#3060e0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Noto Serif TC',serif;min-height:100vh;
  background-image:radial-gradient(ellipse 70% 50% at 10% 5%,#141428 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 90% 95%,#0a1520 0%,transparent 60%);}

/* ── Header ── */
header{text-align:center;padding:22px 16px 14px;border-bottom:1px solid var(--border);position:relative;}
.hd{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
h1{font-family:'Ma Shan Zheng',serif;font-size:clamp(20px,5vw,34px);color:var(--gold);
  letter-spacing:.28em;text-shadow:0 0 30px rgba(200,168,74,.35),0 2px 4px rgba(0,0,0,.8);}
.hsub{font-size:11px;color:var(--muted);letter-spacing:.16em;margin-top:4px;}

/* ── Layout ── */
.wrap{max-width:1060px;margin:0 auto;padding:16px 14px 40px;
  display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){
  .wrap{grid-template-columns:400px 1fr;align-items:start;}
  .col-r{grid-column:2;}
}

/* ── Card ── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.ch{display:flex;align-items:center;gap:8px;padding:10px 15px;
  border-bottom:1px solid var(--border);background:var(--panel2);}
.ch-icon{font-size:14px;}
.ch-title{font-size:11px;letter-spacing:.12em;color:var(--text2);text-transform:uppercase;font-weight:600;}
.ch-tag{margin-left:auto;font-size:9px;color:var(--muted);}
.cb{padding:13px 15px;}

/* ── Form ── */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;margin-bottom:10px;}
.wrap>*{min-width:0;}
.qtag.cat.on{border-color:var(--gold);color:var(--bg);background:var(--gold);}
.vd{display:inline-block;font-size:13px;font-weight:700;padding:2px 12px;border-radius:14px;}
.vd.sm{font-size:10px;padding:1px 7px;min-width:34px;text-align:center;}
.vd-ji{background:#1d6b3f;color:#d8ffe6}.vd-ji2{background:#20473a;color:#9fe8c0}
.vd-ping{background:#33334d;color:#c8c8e0}.vd-xi2{background:#5a2c22;color:#f0b8a8}.vd-xi{background:#7a1f1f;color:#ffd0d0}
.ys-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ys-total{font-size:12px;color:var(--text2);}
.ys-row{padding:8px 0;border-top:1px solid var(--border);cursor:pointer;}
.ys-name{font-size:11px;color:var(--gold);letter-spacing:.05em;}
.ys-neg{font-size:9px;color:var(--muted);margin-left:6px;}
.ys-body{font-size:13px;margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.ys-miss{color:var(--muted);}
.ys-sc{margin-left:auto;font-weight:700;font-size:12px;color:var(--text2);}
.ys-sc.pos{color:#50c888}.ys-sc.neg{color:#e07060}
.ys-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.yc{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid var(--border2);color:var(--text2);}
.yc i{font-style:normal;margin-left:3px;opacity:.75;}
.yc-ji{border-color:#2f7a52;color:#7ad8a4}.yc-xiong{border-color:#7a3a30;color:#e89a88}.yc-info{border-color:#3a5a8a;color:#8ab4e8}
.ys-flags{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.yf{font-size:12px;color:var(--text2);margin:3px 0;}.yf.pos{color:#7ad8a4}.yf.neg{color:#e89a88}
.ys-note{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.6;}
.tr{display:grid;grid-template-columns:92px 1fr 44px 52px;align-items:center;gap:6px;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:12px;}
.tr:hover{background:var(--panel2);}
.tr.now{background:rgba(200,168,74,.07);cursor:default;}
.tr.best .tl::before{content:'★ ';color:var(--gold);}
.tl em{font-style:normal;font-size:9px;color:var(--gold);margin-left:4px;}
.tbar{position:relative;height:6px;background:var(--panel2);border-radius:3px;}
.tbar span{position:absolute;top:0;height:6px;border-radius:3px;}
.tbar .tp{background:#3fae72}.tbar .tn{background:#c0503c}
.td{font-size:11px;color:var(--text2);text-align:right;}
.cell.ysp{box-shadow:inset 0 0 0 2px rgba(80,200,136,.55);}
.bc.bc-ys{left:3px;top:2px;bottom:auto;color:#7ad8a4;background:rgba(80,200,136,.18);}
.cs b{font-weight:600;}
.setp{margin:2px 0 10px;border:1px solid var(--border2);border-radius:8px;background:var(--panel2);}
.setp summary{cursor:pointer;padding:7px 10px;font-size:12px;color:var(--text2);list-style:none;}
.setp summary::-webkit-details-marker{display:none;}
#setSum{font-size:10px;color:var(--muted);margin-left:6px;}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 10px 10px;}
.setg label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);}
.setg label.chk{flex-direction:row;align-items:center;gap:6px;font-size:11px;color:var(--text2);}
.setg select,.setg input[type=number]{background:var(--panel);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:5px 6px;font-size:12px;width:100%;font-family:inherit;}
.wsx{font-size:.62em;opacity:.7;margin-left:1px;vertical-align:super;}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:4px;text-transform:uppercase;}
.field select,.field input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--border2);
  color:var(--text);padding:7px 9px;border-radius:7px;font-family:'Noto Serif TC',serif;font-size:13px;
  outline:none;transition:border-color .2s,box-shadow .2s;appearance:none;}
.field select:focus,.field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,168,74,.12);}
.qwrap{margin-bottom:10px;}
.qwrap label{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:5px;text-transform:uppercase;}
.qwrap textarea{width:100%;background:var(--panel2);border:1px solid var(--border2);color:var(--text);
  padding:9px 12px;border-radius:8px;font-family:'Noto Serif TC',serif;font-size:14px;
  resize:vertical;min-height:64px;max-height:130px;outline:none;line-height:1.6;
  transition:border-color .2s,box-shadow .2s;}
.qwrap textarea::placeholder{color:var(--muted);font-size:13px;}
.qwrap textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,168,74,.12);}
.qtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.qtag{font-size:11px;padding:3px 9px;border:1px solid var(--border2);border-radius:20px;
  color:var(--text2);cursor:pointer;background:transparent;transition:all .18s;font-family:'Noto Serif TC',serif;}
.qtag:hover{border-color:var(--gold);color:var(--gold);background:rgba(200,168,74,.08);}
.brow{display:flex;gap:8px;flex-wrap:wrap;}
.btn{padding:8px 18px;border:1px solid currentColor;background:transparent;font-family:'Noto Serif TC',serif;
  font-size:13px;letter-spacing:.08em;border-radius:7px;cursor:pointer;transition:all .2s;
  color:var(--gold);display:flex;align-items:center;gap:5px;}
.btn:hover{background:var(--gold);color:var(--bg);}
.btn.now{color:var(--teal);}
.btn.now:hover{background:var(--teal);color:var(--bg);}
.btn.primary{background:var(--gold);color:var(--bg);font-weight:600;}
.btn.primary:hover{background:var(--gold2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.compass-btn{color:#90c0e0;border-color:#90c0e0;}
.btn.compass-btn:hover{background:#90c0e0;color:var(--bg);}

/* ── Info chips ── */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;}
.ichip{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 10px;}
.ichip-l{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.ichip-v{font-size:13px;color:var(--gold);font-weight:600;margin-top:2px;}
.cv-yang{color:var(--yang);}.cv-yin{color:var(--yin);}.cv-kong{color:var(--kong-clr);}

/* ── Board ── */
.bwrap{padding:12px;}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  aspect-ratio:1/1;gap:3px;background:var(--border);
  border:1.5px solid var(--gold-dim);border-radius:9px;overflow:hidden;
  box-shadow:0 0 40px rgba(200,168,74,.1),inset 0 0 40px rgba(0,0,0,.5);}
.cell{background:var(--surface);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;padding:3px 3px 15px;position:relative;overflow:hidden;transition:background .2s;}
.cell:hover{background:#131320;}
.cell[data-p="5"]{background:#0b0b15;}
.cell.zf{background:#161408;border:1px solid rgba(200,168,74,.25);}
.cell.zs{background:#081614;border:1px solid rgba(24,176,144,.25);}
.cell.zf.zs{background:#0e1408;}
.cell.kong{background:#140808;border:1px solid rgba(176,48,48,.2);}
.pn{position:absolute;top:3px;left:5px;font-size:8px;color:var(--muted);}
.pd{position:absolute;top:3px;right:4px;font-size:7px;color:var(--muted);letter-spacing:0;}
.cg{font-size:clamp(8px,1.9vw,12px);color:var(--purple);font-weight:600;}
.cs{font-size:clamp(9px,2.1vw,13px);color:#e8b840;font-weight:700;}
.cd{font-size:clamp(8px,1.9vw,12px);color:#50c888;font-weight:600;}
.ce{font-size:clamp(8px,1.9vw,12px);font-weight:700;}
.eq{color:var(--qi-clr);}.ey{color:var(--yi-clr);}
.dv{width:50%;height:1px;background:var(--border2);margin:1px 0;flex-shrink:0;}
.bc{position:absolute;bottom:2px;font-size:7px;border-radius:3px;padding:0 3px;font-weight:700;}
.bc-zf{right:3px;color:var(--gold);background:rgba(200,168,74,.18);}
.bc-zs{left:3px;color:var(--teal2);background:rgba(24,176,144,.15);}
.bc-ko{right:3px;bottom:11px;color:var(--kong-clr);background:rgba(176,48,48,.15);}
.cn{font-size:7px;color:var(--muted);letter-spacing:0;}
.lgrow{display:flex;flex-wrap:wrap;gap:6px;padding:9px 13px;border-top:1px solid var(--border);justify-content:center;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── 指引卡 ── */
.guide-card{margin:0 15px 15px;border:1px solid var(--border2);border-radius:10px;overflow:hidden;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.gc-header{padding:13px 15px 11px;display:flex;align-items:flex-start;gap:11px;
  background:linear-gradient(135deg,#1a1a0e 0%,#12120a 100%);border-bottom:1px solid var(--border2);}
.gc-header.yin-header{background:linear-gradient(135deg,#0a121e 0%,#080e18 100%);}
.gc-badge{font-size:22px;flex-shrink:0;margin-top:2px;filter:drop-shadow(0 0 8px rgba(200,168,74,.5));}
.gc-tone{font-size:15px;color:var(--gold2);font-weight:700;letter-spacing:.05em;line-height:1.4;}
.gc-format{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.08em;}
.gc-body{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);}
.gc-item{background:var(--panel);padding:11px 13px;display:flex;flex-direction:column;gap:4px;}
.gc-item:last-child:nth-child(odd){grid-column:1/-1;}
.gc-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px;}
.gc-label-icon{font-size:12px;}
.gc-val{font-size:13px;color:var(--text);line-height:1.6;}
.gc-val strong{color:var(--gold);}
.gc-quote{padding:12px 15px;background:var(--panel2);font-size:13px;color:var(--teal2);
  font-style:italic;letter-spacing:.05em;line-height:1.7;border-top:1px solid var(--border2);text-align:center;}
.gj-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:12px;
  font-weight:700;letter-spacing:.08em;margin-bottom:4px;}
.gj-ji{background:rgba(200,168,74,.2);color:var(--gold2);}
.gj-xiong{background:rgba(176,48,48,.2);color:#e06060;}
.gj-ping{background:rgba(80,80,120,.3);color:#a0a0d0;}

/* ── 指南針卡 ── */
.compass-card{
  margin:0 15px 15px;
  border:1px solid var(--border2);
  border-radius:10px;overflow:hidden;
  animation:fadeUp .5s ease;
}
.compass-card .ch{background:linear-gradient(135deg,#0a1220 0%,#080e18 100%);}
.compass-body{
  display:flex;flex-direction:column;align-items:center;
  padding:12px 12px;gap:10px;
}
/* Canvas 包裝 */
.compass-canvas-wrap{
  position:relative;
  width:min(260px,80vw);
  height:min(260px,80vw);
}
#compassCanvas{
  width:100%;height:100%;
  border-radius:50%;
  box-shadow:0 0 30px rgba(144,192,224,.2),0 0 60px rgba(0,0,0,.6);
}

/* 吉方列表 */
.ji-list{
  width:100%;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:7px;
}
.ji-item{
  display:flex;align-items:center;gap:9px;
  background:var(--panel2);border:1px solid var(--border2);
  border-radius:8px;padding:8px 11px;cursor:pointer;
  transition:all .2s;
}
.ji-item:hover{border-color:var(--gold);background:rgba(200,168,74,.06);}
.ji-item.active{border-color:var(--gold);box-shadow:0 0 10px rgba(200,168,74,.2);}
.ji-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor;}
.ji-info{flex:1;}
.ji-dir{font-size:13px;font-weight:700;color:var(--text);}
.ji-door{font-size:10px;color:var(--muted);margin-top:1px;}

/* 羅盤狀態 */
.compass-status{
  display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--muted);letter-spacing:.08em;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--muted);
  transition:background .3s;
}
.status-dot.active{background:var(--teal2);box-shadow:0 0 6px var(--teal2);animation:pulse 2s infinite;}
.status-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* 偏差顯示 */
.bearing-info{
  font-size:12px;color:var(--muted);text-align:center;
  display:flex;gap:14px;justify-content:center;
}
.bearing-val{color:var(--gold);font-weight:600;font-size:14px;}

/* ── 對話區 ── */
.chat-area{display:flex;flex-direction:column;max-height:320px;min-height:100px;overflow-y:auto;
  padding:13px 15px;gap:12px;scroll-behavior:smooth;}
.chat-area::-webkit-scrollbar{width:4px;}
.chat-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.msg{display:flex;gap:8px;align-items:flex-start;animation:msgIn .3s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;border:1px solid var(--border2);}
.msg.user .av{background:var(--ai-user);}
.msg.bot  .av{background:var(--panel2);}
.bubble{max-width:88%;padding:8px 12px;border-radius:11px;font-size:13px;line-height:1.75;border:1px solid var(--border);}
.msg.user .bubble{background:var(--ai-user);border-color:var(--border2);border-top-right-radius:3px;}
.msg.bot  .bubble{background:var(--ai-bot);border-top-left-radius:3px;}
.bubble strong{color:var(--gold);}
.bubble em{color:var(--teal2);font-style:normal;}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:db .9s ease-in-out infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes db{0%,80%,100%{transform:translateY(0);opacity:.4;}40%{transform:translateY(-5px);opacity:1;}}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;color:var(--muted);text-align:center;gap:8px;}
.ce-icon{font-size:30px;opacity:.35;}
.ce-text{font-size:12px;line-height:1.8;letter-spacing:.05em;}
/* ── 雙盤並排 ── */
.dual-compass-row{
  display:flex;
  gap:8px;
  width:100%;
  justify-content:center;
  align-items:flex-start;
}
.compass-panel{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  flex-shrink:0; /* 不讓 flex 壓縮 */
}
.compass-panel-label{
  font-size:10px;letter-spacing:.08em;color:var(--text2);
  text-transform:uppercase;font-weight:600;white-space:nowrap;
}
.compass-panel-info{
  display:flex;align-items:center;gap:5px;
}
/* canvas 包裝：尺寸由 JS 計算後設定，始終正方形 */
.compass-canvas-wrap{
  position:relative;
  /* width/height 由 JS 動態設定 */
  flex-shrink:0;
}
/* canvas 本身填滿包裝 */
#deviceCanvas,#jiCanvas{
  display:block;
  border-radius:50%;
  box-shadow:0 0 20px rgba(144,192,224,.15),0 0 40px rgba(0,0,0,.5);
}

/* 偏差提示 */
.diff-hint{
  display:flex;align-items:center;gap:14px;
  background:var(--panel2);border:1px solid var(--border2);
  border-radius:10px;padding:10px 18px;width:100%;
  justify-content:center;
}
.diff-arrow{
  font-size:28px;transition:transform .3s ease;
  color:var(--gold);filter:drop-shadow(0 0 6px rgba(200,168,74,.5));
}
.diff-label{font-size:11px;color:var(--muted);letter-spacing:.05em;}
.diff-hint.in-range{border-color:#3fae72;box-shadow:0 0 12px rgba(63,174,114,.35);}
.diff-hint.in-range #diffBearing{color:#7ad8a4;}

/* ── 九宮格點擊互動 ── */
.cell{cursor:pointer;}
.cell:hover .cell-tap-hint{opacity:1;}
.cell-tap-hint{
  position:absolute;bottom:14px;left:0;right:0;
  text-align:center;font-size:7px;color:var(--gold);
  opacity:0;transition:opacity .2s;letter-spacing:.05em;
  pointer-events:none;
}
.cell-selected{
  background:#1a1600 !important;
  border:1px solid var(--gold) !important;
  box-shadow:inset 0 0 12px rgba(200,168,74,.15);
}

/* ── 歷史紀錄 ── */
.hist-btn{
  margin-left:auto;
  background:transparent;border:1px solid var(--border2);
  color:var(--text2);border-radius:5px;
  padding:3px 9px;font-size:10px;cursor:pointer;
  font-family:'Noto Serif TC',serif;
  transition:all .18s;letter-spacing:.05em;
  opacity:0.7;
}
.hist-btn:hover{border-color:var(--gold);color:var(--gold);opacity:1;}
.hist-drawer{
  border-bottom:1px solid var(--border);
  background:var(--panel2);
  max-height:320px;overflow-y:auto;
}
.hist-drawer::-webkit-scrollbar{width:3px;}
.hist-drawer::-webkit-scrollbar-thumb{background:var(--border2);}
.hist-head{

<body>
<header>
  <div class="hd"></div>
  <h1>奇門遁甲</h1>
  <p class="hsub">行動指引 · 問卦諮詢 · 吉方指南針</p>
</header>

<div class="wrap">
  <!-- ═══ 左欄 ═══ -->
  <div>

    <div class="card">
      <div class="ch"><span class="ch-icon">🗓</span><span class="ch-title">起盤設定</span></div>
      <div class="cb">
        <div class="fg">
          <div class="field"><label>年</label><input type="number" id="inYear" min="1900" max="2100"></div>
          <div class="field"><label>月</label><select id="inMonth"></select></div>
          <div class="field"><label>日</label><select id="inDay"></select></div>
          <div class="field">
            <label>時辰</label>
            <select id="inHour">
              <option value="0">子 0–1（早子）</option><option value="1">丑 1–3</option>
              <option value="2">寅 3–5</option><option value="3">卯 5–7</option>
              <option value="4">辰 7–9</option><option value="5">巳 9–11</option>
              <option value="6">午 11–13</option><option value="7">未 13–15</option>
              <option value="8">申 15–17</option><option value="9">酉 17–19</option>
              <option value="10">戌 19–21</option><option value="11">亥 21–23</option><option value="12">晚子 23–24</option>
            </select>
          </div>
        </div>
        <details class="setp" id="setPanel">
          <summary>⚙ 排盤設定 <span id="setSum"></span></summary>
          <div class="setg">
            <label>置局法<select id="sMethod"><option value="chai">拆補法</option><option value="zhirun">置閏法</option></select></label>
            <label>中五寄宮<select id="sJi"><option value="kun">寄坤二宮</option><option value="genkun">陽遁寄艮、陰遁寄坤</option></select></label>
            <label>23 點後<select id="sZi"><option value="next">換日（算次日子時）</option><option value="same">晚子時不換日</option></select></label>
            <label>出生年（年命，選填）<input type="number" id="sBirth" placeholder="西元，如 1975" min="1900" max="2099"></label>
            <label class="chk"><input type="checkbox" id="sTst"> 「現在」用真太陽時</label>
            <label>經度<input type="number" id="sLon" step="0.1" min="100" max="140"></label>

        </details>
        <div class="qtags" id="catRow"></div>
        <div class="qwrap">

        <div class="brow">

        <div class="leg"><div class="ld" style="background:#e8b830"></div>三奇</div>

    <!-- 吉方指南針 -->

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js" crossorigin="anonymous"></script>
<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════

// ═══════════════════════════════════════
//  常數（完整保留 v4 邏輯）
// ═══════════════════════════════════════
const TIAN_GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DI_ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const J60=[];for(let i=0;i<60;i++)J60.push(TIAN_GAN[i%10]+DI_ZHI[i%12]);
const PDIR={1:'坎北',2:'坤西南',3:'震東',4:'巽東南',5:'中宮',6:'乾西北',7:'兌西',8:'艮東北',9:'離南'};
const STEMS9=['戊','己','庚','辛','壬','癸','丁','丙','乙'];
const SAN_QI=new Set(['丁','丙','乙']);
const DOOR_BASE={1:'休門',2:'死門',3:'傷門',4:'杜門',9:'景門',7:'驚門',6:'開門',8:'生門'};
const STAR_BASE={1:'蓬星',2:'芮星',3:'沖星',4:'輔星',5:'禽星',6:'心星',7:'柱星',8:'任星',9:'英星'};
const GODS=['值符','螣蛇','太陰','六合','白虎','玄武','九地','九天'];
const GPATH=[1,8,3,4,9,2,7,6];
const P9=[1,2,3,4,5,6,7,8,9];
const BOARD_LO=[4,9,2,3,5,7,8,1,6];
const ZTP={子:1,丑:8,寅:8,卯:3,辰:4,巳:4,午:9,未:2,申:2,酉:7,戌:6,亥:6};
const SHI_N=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

// 宮位 → 方位角（正北=0°，順時針）
// 奇門九宮方位：
//   9離=南=180°, 1坎=北=0°, 3震=東=90°, 7兌=西=270°
//   4巽=東南=135°, 8艮=東北=45°, 6乾=西北=315°, 2坤=西南=225°
const PALACE_DEG={1:0,9:180,3:90,7:270,4:135,8:45,6:315,2:225,5:null};

// 吉門：由好到次好
const JI_DOORS   =['生門','開門','休門','景門'];
const XIONG_DOORS=['死門','驚門','傷門','杜門'];

// 五行色
const WX_COLOR={
  '木':'#38b848','火':'#e85030','土':'#c89820','金':'#90c0e0','水':'#3060e0'
};
// 宮位五行
const PAL_WX={1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};

// 門的吉凶色
const DOOR_COLOR={
  '生門':'#38b848','開門':'#90c0e0','休門':'#c8a84a','景門':'#d8a060',
  '死門':'#a03030','驚門':'#a03090','傷門':'#c06020','杜門':'#606090'
};

// ═══════════════════════════════════════
//  排盤引擎 v8 — 時家轉盤奇門
//  拆補法／置閏法、中五寄宮、晚子時、月令旺衰
//  干支、節氣由 lunar-javascript 精確計算
// ═══════════════════════════════════════

// 排盤設定（存在 localStorage）
const SET_KEY='qimen_settings';
const SET_DEF={method:'chai',ji:'kun',zi:'next',birth:'',tst:false,lon:121.5};
let SET={...SET_DEF};
try{Object.assign(SET,JSON.parse(localStorage.getItem(SET_KEY)||'{}'));}catch(e){}
function saveSet(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}}

// 24 節氣 → [上元, 中元, 下元] 局數
const JU_TABLE={
  冬至:[1,7,4],小寒:[2,8,5],大寒:[3,9,6],立春:[8,5,2],雨水:[9,6,3],驚蟄:[1,7,4],
  春分:[3,9,6],清明:[4,1,7],穀雨:[5,2,8],立夏:[4,1,7],小滿:[5,2,8],芒種:[6,3,9],
  夏至:[9,3,6],小暑:[8,2,5],大暑:[7,1,4],立秋:[2,5,8],處暑:[1,4,7],白露:[9,3,6],
  秋分:[7,1,4],寒露:[6,9,3],霜降:[5,8,2],立冬:[6,9,3],小雪:[5,8,2],大雪:[4,7,1],
};
const JQ24=['冬至','小寒','大寒','立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種',
  '夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪'];
const YANG_JQ=new Set(JQ24.slice(0,12));
const YUAN_N=['上元','中元','下元'];
const JQ_S2T={'惊':'驚','蛰':'蟄','谷':'穀','满':'滿','种':'種','处':'處'};
const toTrad=s=>s.replace(/[惊蛰谷满种处]/g,c=>JQ_S2T[c]);

// 八宮環形（順時針）：坎→艮→震→巽→離→坤→兌→乾
const RING=[1,8,3,4,9,2,7,6];
const RING_STAR={1:'蓬星',8:'任星',3:'沖星',4:'輔星',9:'英星',2:'芮星',7:'柱星',6:'心星'};
const RING_DOOR={1:'休門',8:'生門',3:'傷門',4:'杜門',9:'景門',2:'死門',7:'驚門',6:'開門'};
const gzIdx=gz=>J60.indexOf(gz);
const dayNum=(y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/864e5);

// 時辰序 0=子(早子 0–1)…11=亥，12=晚子(23–24，不換日)
SHI_N[12]='晚子';
function shiToHour(shi){return shi===12?23:shi===0?0:shi*2;}

function lunarOf(y,m,d,shi){
  if(typeof Solar==='undefined')throw new Error('曆法模組未載入，請連網後重新整理');
  return Solar.fromYmdHms(y,m,d,shiToHour(shi),30,0).getLunar();
}

// ── 拆補法：當下節氣（依交節時刻）＋ 符頭地支定元
function calcJuChai(lunar){
  const jieqi=toTrad(lunar.getPrevJieQi(false).getName());
  const dIdx=gzIdx(lunar.getDayInGanZhi());
  const fuIdx=dIdx-(dIdx%5);
  const z=fuIdx%12;
  const yi=[0,6,3,9].includes(z)?0:[2,8,5,11].includes(z)?1:2;
  return{jieqi,yi,fuTou:J60[fuIdx],run:false};
}

// ── 置閏法：上元符頭（甲子、己卯、甲午、己酉日）每 15 日一節氣，
//    以冬至、夏至校正：符頭超神 9 日以上時，於芒種／大雪置閏重排一節
const _solCache={};
function solstices(y){
  if(_solCache[y])return _solCache[y];
  const t=Solar.fromYmd(y,7,1).getLunar().getJieQiTable();
  const f=(s,n)=>({n,d:dayNum(s.getYear(),s.getMonth(),s.getDay())});
  return _solCache[y]=[f(t['冬至'],'冬至'),f(t['夏至'],'夏至')];
}
function calcJuZhirun(lunar){
  const so=lunar.getSolar();
  const D=dayNum(so.getYear(),so.getMonth(),so.getDay());
  const dIdx=gzIdx(lunar.getDayInGanZhi());
  const F=D-(dIdx%15);                                   // 本節上元符頭
  const cand=[];
  for(const yy of [so.getYear()-1,so.getYear(),so.getYear()+1])
    for(const s of solstices(yy)){
      const A=F+15*Math.ceil((s.d-9-F)/15);              // 該至之第一個符頭（超神不逾 9 日）
      if(A<=F)cand.push({...s,A});
    }
  cand.sort((a,b)=>b.A-a.A);
  const S=cand[0];
  const k=(F-S.A)/15;
  const base=JQ24.indexOf(S.n);
  const run=k>=12;
  const jieqi=JQ24[(base+(run?11:k))%24];
  const yi=Math.floor((D-F)/5);
  return{jieqi,yi,fuTou:J60[dIdx-(dIdx%5)],run};
}

function epFn(ju,dun){
  const ep={};
  for(let i=0;i<9;i++){const idx=dun==='陽遁'?(ju-1+i)%9:((ju-1-i)%9+9)%9;ep[P9[idx]]=STEMS9[i];}
  return ep;
}
function getXun(hIdx){
  const xs=Math.floor(hIdx/10)*10;
  const YI=['戊','己','庚','辛','壬','癸'];
  const ki=[(xs%12+10)%12,(xs%12+11)%12];
  return{xunYi:YI[xs/10],xunName:J60[xs]+'旬',kongZhi:ki.map(i=>DI_ZHI[i])};
}

// 月令旺衰
const ZHI_WX={寅:'木',卯:'木',巳:'火',午:'火',申:'金',酉:'金',亥:'水',子:'水',辰:'土',戌:'土',丑:'土',未:'土'};
const STEM_WX={甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};
const DOOR_WX={休門:'水',生門:'土',傷門:'木',杜門:'木',景門:'火',死門:'土',驚門:'金',開門:'金'};
const STAR_WX={蓬星:'水',任星:'土',沖星:'木',輔星:'木',英星:'火',芮星:'土',柱星:'金',心星:'金',禽星:'土'};
const WX_KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
const WX_SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
function wxState(x,ling){
  if(!x||!ling)return'';
  if(x===ling)return'旺';if(WX_SHENG[ling]===x)return'相';if(WX_SHENG[x]===ling)return'休';
  if(WX_KE[x]===ling)return'囚';return'死';
}

function doBoard(y,m,d,shi){
  const lunar=lunarOf(y,m,d,shi);
  const dGz=lunar.getDayInGanZhi(), hGz=lunar.getTimeInGanZhi();
  const dIdx=gzIdx(dGz), hi=gzIdx(hGz);
  const J=SET.method==='zhirun'?calcJuZhirun(lunar):calcJuChai(lunar);
  const{jieqi,yi,fuTou,run}=J;
  const dun=YANG_JQ.has(jieqi)?'陽遁':'陰遁';
  const ju=JU_TABLE[jieqi][yi],yuan=YUAN_N[yi];
  // 中五寄宮：寄坤，或陽遁寄艮、陰遁寄坤
  const JG=SET.ji==='genkun'&&dun==='陽遁'?8:2;
  const jiGong=p=>p===5?JG:p;
  const ringIdx=p=>RING.indexOf(jiGong(p));

  const ep=epFn(ju,dun);
  const{xunYi,xunName,kongZhi}=getXun(hi);
  const kongPals=new Set(kongZhi.map(z=>ZTP[z]).filter(Boolean));
  const stemPal=s=>+Object.entries(ep).find(([,v])=>v===s)[0];

  const xp=stemPal(xunYi);
  const zfs=xp===5?'禽星':RING_STAR[xp];
  const zsd=RING_DOOR[jiGong(xp)];

  const hgan=hGz[0];
  const zfp=jiGong(stemPal(hgan==='甲'?xunYi:hgan));
  const starShift=((ringIdx(zfp)-ringIdx(xp))%8+8)%8;
  const hp={},hs={};
  RING.forEach((p,i)=>{
    const to=RING[(i+starShift)%8];
    hp[to]=RING_STAR[p]+(p===JG?'·禽':'');
    hs[to]=ep[p]+(p===JG?ep[5]:'');
  });
  hp[5]='—';hs[5]='';

  const steps=hi%10;
  let zsp=dun==='陽遁'?((xp-1+steps)%9)+1:(((xp-1-steps)%9+9)%9)+1;
  zsp=jiGong(zsp);
  const doorShift=((ringIdx(zsp)-ringIdx(xp))%8+8)%8;
  const hmp={};
  RING.forEach((p,i)=>{hmp[RING[(i+doorShift)%8]]=RING_DOOR[p];});
  hmp[5]='—';

  const gp={};const g0=RING.indexOf(zfp);
  for(let i=0;i<8;i++){const k=dun==='陽遁'?g0+i:g0-i;gp[RING[(k%8+8)%8]]=GODS[i];}
  gp[5]='—';

  const mz=lunar.getMonthZhiExact();
  return{dun,ju,jieqi,yuan,fuTou,run,method:SET.method,JG,ep,hp,hs,hmp,gp,
    dayGZ:{gz:dGz,gan:dGz[0],zhi:dGz[1],idx:dIdx},
    hgan,hzhi:hGz[1],hi,
    xp,zfp,xunYi,xunName,kongZhi,kongPals,zfs,zsd,zsp,
    ling:{zhi:mz,wx:ZHI_WX[mz]},
    fuyin:starShift===0,fanyin:starShift===4,
    dfuyin:doorShift===0,dfanyin:doorShift===4,
    date:{y,m,d,shi}};
}

function stemHeavenPal(R,st){
  for(const p of [1,2,3,4,6,7,8,9])if((R.hs[p]||'').includes(st))return p;
  return null;
}
function stemOfGan(R,gan,xunYiOf){       // 甲遁於所屬旬的旬首儀
  return gan==='甲'?xunYiOf:gan;
}
function locateYS(R,y){
  const find=(o,v)=>{const k=Object.keys(o).find(p=>p!=='5'&&o[p]&&o[p].split('·')[0]===v);return k?+k:null;};
  if(y.door)return find(R.hmp,y.door);
  if(y.god)return find(R.gp,y.god);
  if(y.star)return y.star==='禽星'?stemHeavenPal(R,R.ep[5]):find(R.hp,y.star);
  if(y.stem)return stemHeavenPal(R,y.stem);
  if(y.horse)return HORSE[R.hzhi];
  return null;
}

// 單宮評分
function evalPalace(R,p){
  const it=[];let sc=0;
  const add=(label,v,kind)=>{v=Math.round(v*10)/10;it.push({label,v,kind:kind||(v>0?'ji':v<0?'xiong':'ping')});sc+=v;};
  const door=R.hmp[p],star=(R.hp[p]||'').split('·')[0],god=R.gp[p],hs=(R.hs[p]||'')[0],es=R.ep[p];
  const ling=R.ling?.wx;
  // 八門、九星：基本吉凶 × 月令旺衰
  const dst=wxState(DOOR_WX[door],ling),sst=wxState(STAR_WX[star],ling);
  if(door in DOOR_SC){const b=DOOR_SC[door];add(door+(dst||''),b+Math.sign(b)*(ST_ADJ[dst]||0));}
  if(star in STAR_SC){const b=STAR_SC[star];add(star+(sst||''),b+Math.sign(b)*(ST_ADJ[sst]||0)*.5);}
  if(god in GOD_SC)add(god,GOD_SC[god]);
  // 十干克應
  const k=KEYING[hs+es];
  if(k){const v=k.v==='門'?Math.sign(DOOR_SC[door]||0):k.v;add(k.n,v,v===0?'info':undefined);}
  // 九遁與吉格
  if(hs==='丙'&&es==='丁'&&door==='生門')add('天遁',2);
  if(hs==='乙'&&es==='己'&&door==='開門')add('地遁',2);
  if(hs==='丁'&&door==='休門'&&god==='太陰')add('人遁',2);
  if(hs==='丙'&&door==='生門'&&god==='九天')add('神遁',2);
  if(hs==='乙'&&p===4&&['開門','休門','生門'].includes(door))add('風遁',1);
  if(p===R.zsp&&es==='丁')add('玉女守門',1);
  if(SAN_QI.has(hs)&&['開門','休門','生門'].includes(door))add('奇門相合',1);
  if(XING_PAL[hs]===p)add(hs+'擊刑',-1.5);
  if(MU_PAL[hs]===p)add(hs+'入墓',-1);
  // 門與宮生剋
  const dw=DOOR_WX[door],pw=PAL_WX[p],db=DOOR_SC[door]||0;
  if(dw&&WX_KE[dw]===pw)add(db>0?'吉門被迫':db<0?'凶門迫宮':'門迫',db===0?-.5:-1);
  else if(dw&&WX_KE[pw]===dw){if(db>0)add('吉門受制',-.5);else if(db<0)add('凶門受制',.5);}
  else if(dw&&WX_SHENG[pw]===dw&&db>0)add('宮生吉門',.5);
  if(R.kongPals.has(p))add('旬空',-2);
  if(HORSE[R.hzhi]===p)add('驛馬',0,'info');
  return{p,score:Math.round(sc*10)/10,items:it,door,star:R.hp[p],god,hs:R.hs[p],es,dst,sst};
}

function palRelation(a,b){
  const x=PAL_WX[a],y=PAL_WX[b];
  if(a===b)return'同宮';if(WX_SHENG[x]===y)return'生';if(WX_KE[x]===y)return'剋';
  if(WX_SHENG[y]===x)return'被生';if(WX_KE[y]===x)return'被剋';return'比和';
}
function birthGZ(){
  const y=parseInt(SET.birth,10);
  if(!(y>1900&&y<2100))return null;
  const i=((y-4)%60+60)%60;return{gz:J60[i],idx:i,gan:J60[i][0]};
}

function analyze(R,cat){
  const C=QCATS[cat]||QCATS.綜合;
  const dStem=stemOfGan(R,R.dayGZ.gan,getXun(R.dayGZ.idx).xunYi),hStem=stemOfGan(R,R.hgan,R.xunYi);
  const dPal=stemHeavenPal(R,dStem),hPal=stemHeavenPal(R,hStem);
  const by=birthGZ();
  const list=[],extra=[];
  let self;
  if(by){
    const yStem=stemOfGan(R,by.gan,getXun(by.idx).xunYi);
    self={n:`求測人（年命${by.gz}）`,p:stemHeavenPal(R,yStem),w:cat==='綜合'?1:.4};
    extra.push({n:'日干'+R.dayGZ.gan,p:dPal,w:.2});
  }else self={n:'求測人（日干'+R.dayGZ.gan+'）',p:dPal,w:cat==='綜合'?1:.4};
  const thing={n:'所問之事（時干'+R.hgan+'）',p:hPal,w:cat==='綜合'?1:.4};
  C.ys.forEach(y=>list.push({n:y.n,p:locateYS(R,y),w:y.w??1,key:y.door||y.god||y.star||y.stem||'驛馬',stem:y.stem}));
  if(cat==='綜合')list.push({n:'值符（大局）',p:R.zfp,w:.6,key:'值符'});
  const all=[self,thing,...extra,...list];
  all.forEach(o=>{if(o.p)o.ev=evalPalace(R,o.p);});
  let num=0,den=0;
  all.filter(o=>o.ev).forEach(o=>{num+=o.w*o.ev.score;den+=Math.abs(o.w);});
  let score=den?num/den:0;
  const flags=[];
  const main=list.find(o=>o.ev&&o.w>0)||thing;
  if(main?.p&&self.p){
    const rel=palRelation(main.p,self.p);
    const RV={同宮:.8,生:.8,被剋:.4,比和:.2,被生:-.2,剋:-.6};
    const txt={同宮:'用神與求測人同宮，事與人相合',生:'用神宮生求測人宮，事來助我',被剋:'求測人宮剋用神宮，我能掌控',
      比和:'用神與求測人比和，平順',被生:'求測人宮生用神宮，需付出較多',剋:'用神宮剋求測人宮，事來壓我'}[rel];
    flags.push({label:txt,v:RV[rel]});score+=RV[rel];
  }
  if(R.fuyin){flags.push({label:'星伏吟：事情遲滯，宜守不宜動',v:-.5});score-=.5;}
  if(R.fanyin){flags.push({label:'星反吟：反覆變動，宜快不宜久',v:-.5});score-=.5;}
  if(R.dfuyin&&!R.fuyin){flags.push({label:'門伏吟：八門不動，人事停滯',v:-.3});score-=.3;}
  if(R.dfanyin&&!R.fanyin){flags.push({label:'門反吟：八門反位，事多反覆',v:-.3});score-=.3;}
  const dg=R.dayGZ.gan,hg=R.hgan,ti=TIAN_GAN.indexOf.bind(TIAN_GAN);
  if(WX_KE[STEM_WX[hg]]===STEM_WX[dg]&&ti(hg)%2===ti(dg)%2){flags.push({label:'五不遇時：時干剋日干，諸事不宜',v:-1});score-=1;}
  const verdict=score>=1.5?'吉':score>=.4?'小吉':score>-.4?'平':score>-1.5?'小凶':'凶';
  return{cat,score:Math.round(score*10)/10,verdict,self,thing,extra,list,flags,
    mainPal:main?.p||null,mainName:main?.n||'',mainStem:main?.stem||null};
}

// 時辰序列：從 (y,m,d,shi) 起往後 n 個時辰（晚子之後接次日丑時）
function shiSeq(y,m,d,shi,n){
  const out=[];let dt=new Date(y,m-1,d),s=shi;
  for(let k=0;k<n;k++){
    out.push({y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate(),shi:s});
    if(s===12){dt.setDate(dt.getDate()+1);s=1;}
    else if(s===11){dt.setDate(dt.getDate()+1);s=0;}
    else s++;
  }
  return out;
}
function scanTimes(y,m,d,shi,cat,n=12){
  const out=[];
  for(const t of shiSeq(y,m,d,shi,n)){
    try{
      const R=doBoard(t.y,t.m,t.d,t.shi);const A=analyze(R,cat);
      out.push({...t,label:`${t.m}/${t.d} ${SHI_N[t.shi]}時`,score:A.score,verdict:A.verdict,zsp:R.zsp,
        pal:A.mainPal,dir:A.mainPal?PDIR[A.mainPal]:'—',door:A.mainPal?R.hmp[A.mainPal]:'—',kong:A.mainPal?R.kongPals.has(A.mainPal):false});
    }catch(e){}
  }
  return out;
}

// ── 應期：近應看時辰，遠應看日
function nextDayWith(R,zhis,maxDays=30){
  const{y,m,d}=R.date;
  for(let k=1;k<=maxDays;k++){
    const z=DI_ZHI[(R.dayGZ.idx+k)%12];
    if(zhis.includes(z)){const dt=new Date(y,m-1,d+k);return`${dt.getMonth()+1}/${dt.getDate()}（${J60[(R.dayGZ.idx+k)%60]}日）`;}
  }
  return null;
}
function yingQi(R,A,times){
  const out=[];const p=A.mainPal;
  if(!p)return out;
  const ev=[...A.list,A.thing].find(o=>o.p===p)?.ev;
  if(R.kongPals.has(p)){
    const fill=nextDayWith(R,R.kongZhi);
    if(fill)out.push({t:`用神旬空，待填實：${fill}`,k:'空'});
  }
  if(ev&&ev.items.some(i=>/入墓$/.test(i.label))&&MU_ZHI[p]){
    const c=nextDayWith(R,[CHONG(MU_ZHI[p])]);
    if(c)out.push({t:`用神入墓，待沖墓（${CHONG(MU_ZHI[p])}日）：${c}`,k:'墓'});
  }
  if(HORSE[R.hzhi]===p)out.push({t:'用神逢驛馬，事主速動，近日即應',k:'馬'});
  const hit=times.slice(1).find(t=>t.zsp===p);
  if(hit)out.push({t:`值使門臨用神宮：${hit.label}（近應）`,k:'使'});
  const zhis=PAL_ZHI[p]||[];
  const d=nextDayWith(R,zhis);
  if(d)out.push({t:`用神宮支（${zhis.join('、')}）：${d}`,k:'支'});
  if(R.fuyin)out.push({t:'星伏吟：應期偏慢，需耐心等候',k:'緩'});
  if(R.fanyin)out.push({t:'星反吟：應期快但易反覆',k:'快'});
  return out;
}

//  吉方計算
// ═══════════════════════════════════════
function calcJiFang(R){
  // 收集所有宮位的門，按吉凶排序
  const result=[];
  for(const pal of [1,2,3,4,6,7,8,9]){
    const door=R.hmp[pal];
    const deg=PALACE_DEG[pal];
    if(deg===null) continue;
    const isKong=R.kongPals.has(pal);
    const jiRank=JI_DOORS.indexOf(door);
    const xiongRank=XIONG_DOORS.indexOf(door);
    result.push({pal,door,deg,isKong,jiRank,xiongRank,
      wx:PAL_WX[pal],color:DOOR_COLOR[door]||'#808080'});
  }
  // 吉門優先（非旬空），再按 jiRank 排序
  result.sort((a,b)=>{
    const aJi=a.jiRank>=0&&!a.isKong;const bJi=b.jiRank>=0&&!b.isKong;
    if(aJi&&!bJi)return -1;if(!aJi&&bJi)return 1;
    if(aJi&&bJi)return a.jiRank-b.jiRank;
    return a.xiongRank-b.xiongRank;
  });
  return result;
}

let compassActive=false;
let rawHeading=null;      // 感應器原始方位（0=北，順時針）
let deviceHeading=null;   // 平滑後方位
let headingAcc=null;      // iOS 精度（度），-1 = 未校準
let lastSensorTs=0;
let targetDeg=0;

// 磁偏角：台灣約 -4.6°（磁北偏西）。0 = 與傳統羅盤一樣用磁北
const DECLINATION=0;

// 24 山：每山 15°，子山正北
const SHAN24=['子','癸','丑','艮','寅','甲','卯','乙','辰','巽','巳','丙','午','丁','未','坤','申','庚','酉','辛','戌','乾','亥','壬'];
const PAL_BY_OCT=[1,8,3,4,9,2,7,6];   // 北起順時針每 45° 一宮
const norm360=d=>((d%360)+360)%360;
const angDiff=(a,b)=>((a-b+540)%360)-180;       // a 相對 b 的最短角差
const shanOf=h=>SHAN24[Math.floor(norm360(h+7.5)/15)];
const palOf=h=>PAL_BY_OCT[Math.floor(norm360(h+22.5)/45)];

function getCalibratedHeading(){
  return deviceHeading===null?null:norm360(deviceHeading+DECLINATION);
}

function setCompassStatus(state,text){
  const dot=document.getElementById('statusDot');
  const txt=document.getElementById('statusText');
  dot.className='status-dot'+(state==='active'?' active':state==='error'?' error':'');
  txt.textContent=text;
}

// 由 alpha/beta/gamma（W3C Z-X'-Y''）算方位：
//   手機平放／微傾 → 用手機頂端所指方向；手機直立 → 改用背面鏡頭所指方向
//   （單純 360-alpha 在手機傾斜時會偏很多）
function headingFromEuler(alpha,beta,gamma){
  const d=Math.PI/180,x=beta*d,y=gamma*d,z=alpha*d;
  const cX=Math.cos(x),cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z);
  let E,N;
  if(Math.abs(cX)>=0.5){E=-cX*sZ;N=cZ*cX;}                       // 裝置 Y 軸（頂端）
  else{E=-cZ*sY-sZ*sX*cY;N=-sZ*sY+cZ*sX*cY;}                      // 裝置 -Z 軸（背面）
  return norm360(Math.atan2(E,N)/d);
}
function screenAngle(){
  const a=screen.orientation&&typeof screen.orientation.angle==='number'?screen.orientation.angle:(window.orientation||0);
  return +a||0;
}

async function startCompass(){
  const btn=document.getElementById('btnCompass');
  if(typeof DeviceOrientationEvent!=='undefined'
     && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{
      const perm=await DeviceOrientationEvent.requestPermission();
      if(perm!=='granted'){setCompassStatus('error','感應器權限被拒絕');return;}
    }catch(e){setCompassStatus('error','權限請求失敗：'+e.message);return;}
  }
  // Android Chrome：只用絕對方位事件；一般 deviceorientation 的 alpha 是相對值，會亂跳
  if('ondeviceorientationabsolute' in window)
    window.addEventListener('deviceorientationabsolute',onOrientation,true);
  else
    window.addEventListener('deviceorientation',onOrientation,true);
  compassActive=true;
  btn.textContent='🧭 感應器追蹤中';
  btn.disabled=true;
  setCompassStatus('active','等待感應器資料…');
  const t0=Date.now();
  setTimeout(()=>{if(lastSensorTs<t0)setCompassStatus('error','收不到方位資料（裝置不支援）');},2500);
  rafId=requestAnimationFrame(drawCompass);
}

function onOrientation(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)){
    h=e.webkitCompassHeading;                         // iOS：已是磁北方位
    headingAcc=typeof e.webkitCompassAccuracy==='number'?e.webkitCompassAccuracy:null;
  }else if((e.type==='deviceorientationabsolute'||e.absolute===true)&&e.alpha!==null){
    h=headingFromEuler(e.alpha,e.beta||0,e.gamma||0);
    headingAcc=null;
  }else return;                                       // 相對方位，不可用
  rawHeading=norm360(h+screenAngle());
  if(deviceHeading===null)deviceHeading=rawHeading;
  lastSensorTs=Date.now();
  if(headingAcc!==null&&(headingAcc<0||headingAcc>25))
    setCompassStatus('error',`精度不足（±${headingAcc<0?'?':Math.round(headingAcc)}°），請將手機畫 8 字校準`);
  else setCompassStatus('active','感應器追蹤中'+(headingAcc!==null?`（±${Math.round(headingAcc)}°）`:''));
}

function selectJiFang(idx){

// ═══════════════════════════════════════
//  Canvas 尺寸：動態計算正方形，解決橢圓問題
// ═══════════════════════════════════════
function resizeCanvases(){
  const row=document.getElementById('compassCard')?.querySelector('.dual-compass-row');
  if(!row) return;
  // 可用寬度 = card 內容寬 - gap - padding
  const cardW=row.getBoundingClientRect().width;
  const gap=8;
  // 每個盤面的邊長：(總寬-gap)/2，最大 200，最小 130
  const size=Math.min(200,Math.max(130,Math.floor((cardW-gap)/2)));

  ['deviceCanvas','jiCanvas'].forEach(id=>{
    const c=document.getElementById(id);
    if(!c) return;
    // 設定 canvas 內部解析度（畫質）：2x device pixel ratio
    const dpr=window.devicePixelRatio||1;
    c.width =size*dpr;
    c.height=size*dpr;
    // 設定 CSS 顯示尺寸（正方形，防橢圓）
    c.style.width =size+'px';
    c.style.height=size+'px';
    // 同步更新 wrap 尺寸
    const wrap=c.parentElement;
    if(wrap){wrap.style.width=size+'px';wrap.style.height=size+'px';}
  });
  // 重繪
  drawDeviceCompass();
  drawJiCompass();
}

// 合成一張圖：左盤 + 右盤 + 底部資訊
function buildShareCanvas(){
  const dc=document.getElementById('deviceCanvas');
  const jc=document.getElementById('jiCanvas');
  if(!dc||!jc) return null;

  const dpr=window.devicePixelRatio||1;
  const S=dc.width; // 每個盤的實際像素尺寸（含 dpr）
  const GAP=Math.round(12*dpr);
  const PAD=Math.round(16*dpr);
  const INFO_H=Math.round(90*dpr);
  const TOTAL_W=S*2+GAP+PAD*2;
  const TOTAL_H=S+PAD*2+INFO_H;

  const c=document.createElement('canvas');
  c.width=TOTAL_W; c.height=TOTAL_H;
  const ctx=c.getContext('2d');

  // 背景
  const bg=ctx.createLinearGradient(0,0,TOTAL_W,TOTAL_H);
  bg.addColorStop(0,'#0e0c1e');bg.addColorStop(1,'#080614');
  ctx.fillStyle=bg;ctx.fillRect(0,0,TOTAL_W,TOTAL_H);

  // 貼兩個盤
  ctx.drawImage(dc, PAD, PAD, S, S);
  ctx.drawImage(jc, PAD+S+GAP, PAD, S, S);

  // 底部文字
  const fSz=Math.round(13*dpr);
  const fSzSm=Math.round(10*dpr);
  ctx.font=`700 ${fSz}px 'Noto Serif TC',serif`;
  ctx.fillStyle='#c8a84a';ctx.textAlign='center';ctx.textBaseline='top';

  const Y=S+PAD+Math.round(10*dpr);
  // 盤局資訊
  const R=curBoard;
  if(R){
    ctx.fillText(`${R.dun} ${R.ju}局・${R.jieqi}${R.yuan}`, TOTAL_W/2, Y);
    ctx.font=`${fSzSm}px serif`;
    ctx.fillStyle='#7a7a9a';
    const ji=jiFangList[selectedJiIdx];
    if(ji){
      ctx.fillText(`吉方：${PDIR[ji.pal]} (${ji.door})`, TOTAL_W/2, Y+fSz+Math.round(6*dpr));
    }
    ctx.fillText('奇門遁甲・行動指引', TOTAL_W/2, Y+fSz*2+Math.round(14*dpr));
  }
  return c;
}

async function downloadCompass(){
  const c=buildShareCanvas();
  if(!c){alert('請先起盤');return;}
  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');

}

async function shareCompass(){
  const c=buildShareCanvas();
  if(!c){alert('請先起盤');return;}
  // 轉 Blob
  c.toBlob(async blob=>{
    const file=new File([blob],'qimen_compass.png',{type:'image/png'});
    if(navigator.share && navigator.canShare({files:[file]})){

          title:'奇門遁甲・吉方指引',

      // fallback：直接下載

// ── 共用：畫圓形背景
function drawBg(ctx, R){
  const grad=ctx.createRadialGradient(0,0,0,0,0,R);
  grad.addColorStop(0,'#1a1428');
  grad.addColorStop(0.7,'#0e0c1e');
  grad.addColorStop(1,'#07060f');
  ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
}

// ── 共用：畫外圓框
function drawRings(ctx, R){
  ctx.beginPath();ctx.arc(0,0,R*0.97,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,74,0.6)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,R*0.70,0,Math.PI*2);
  ctx.strokeStyle='rgba(200,168,74,0.3)';ctx.lineWidth=1;ctx.stroke();
}

// ── 共用：畫刻度（傳入底盤已旋轉的 ctx）
function drawTicks(ctx, R){
  for(let deg=0;deg<360;deg+=5){
    const a=deg*Math.PI/180;
    const isMajor=deg%45===0;const isMinor=deg%15===0;
    const inner=isMajor?R*0.88:isMinor?R*0.90:R*0.92;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,-inner);ctx.lineTo(0,-R*0.96);
    ctx.strokeStyle=isMajor?'rgba(200,168,74,0.9)':isMinor?'rgba(200,168,74,0.5)':'rgba(200,168,74,0.22)';
    ctx.lineWidth=isMajor?2:0.8;ctx.stroke();
    ctx.restore();
  }
}

// ── 共用：畫八卦文字（在已旋轉的底盤 ctx 中，rot=底盤總旋轉量）
function drawDirs(ctx, R, rot, colorFn){
  const dirs=[
    {t:'離',deg:180,color:'#e87050'},
    {t:'坎',deg:0,  color:'#5080e8'},
    {t:'震',deg:90, color:'#40c858'},
    {t:'兌',deg:270,color:'#90c8e8'},
    {t:'巽',deg:135,color:'#70b840'},
    {t:'艮',deg:45, color:'#5888c8'},
    {t:'坤',deg:225,color:'#c0a030'},
    {t:'乾',deg:315,color:'#80a8d0'},
  ];
  for(const d of dirs){
    const a=d.deg*Math.PI/180;
    ctx.save();ctx.rotate(a);ctx.translate(0,-R*0.80);
    ctx.rotate(-a-rot);
    ctx.font=`bold ${R*0.09}px 'Noto Serif TC',serif`;
    ctx.fillStyle=colorFn?colorFn(d):d.color;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(d.t,0,0);ctx.restore();
  }
}

// ── 共用：畫太極中心
function drawTaiji(ctx, R){
  const tR=R*0.10;
  const grad=ctx.createRadialGradient(0,0,0,0,0,R*0.15);
  grad.addColorStop(0,'#2a2040');grad.addColorStop(1,'#14101e');
  ctx.beginPath();ctx.arc(0,0,R*0.15,0,Math.PI*2);
  ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='rgba(200,168,74,0.6)';ctx.lineWidth=1.5;ctx.stroke();
  // 太極圖
  ctx.beginPath();ctx.arc(0,0,tR,0,Math.PI*2);
  ctx.fillStyle='rgba(240,224,144,0.9)';ctx.fill();
  ctx.beginPath();
  ctx.arc(0,0,tR,-Math.PI/2,Math.PI/2);
  ctx.lineTo(0,tR);ctx.arc(0,tR/2,tR/2,Math.PI/2,-Math.PI/2,true);
  ctx.arc(0,-tR/2,tR/2,Math.PI/2,-Math.PI/2);ctx.closePath();
  ctx.fillStyle='rgba(20,14,32,0.95)';ctx.fill();
  ctx.beginPath();ctx.arc(0,-tR/2,tR/6,0,Math.PI*2);ctx.fillStyle='rgba(240,224,144,0.9)';ctx.fill();
  ctx.beginPath();ctx.arc(0,tR/2,tR/6,0,Math.PI*2);ctx.fillStyle='rgba(20,14,32,0.95)';ctx.fill();
}

// ── 座標約定（兩個盤共用）──
//   地理角 g（0=北、順時針）。底盤 ctx.rotate(dialRot) 之後：
//   點位 = (sin g·r, −cos g·r)；扇形 arc 角 = (g−90)°；文字用 rotate(g)+translate(0,−r)
const G2ARC=g=>(g-90)*Math.PI/180;
function sectorPath(ctx,g,half,r1,r2){
  ctx.beginPath();ctx.arc(0,0,r2,G2ARC(g-half),G2ARC(g+half));ctx.arc(0,0,r1,G2ARC(g+half),G2ARC(g-half),true);ctx.closePath();
}
function drawPalaceLines(ctx,R,r1){
  for(let k=0;k<8;k++){                       // 宮界在 22.5° + 45°k
    const a=(22.5+45*k)*Math.PI/180;
    ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,-r1);ctx.lineTo(0,-R*0.87);
    ctx.strokeStyle='rgba(200,168,74,0.25)';ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
  }
}

// ════════════════════════════════════════
//  裝置羅盤：盤面隨手機轉，畫面正上方 = 手機朝向
// ════════════════════════════════════════
function drawDeviceCompass(){
  const canvas=document.getElementById('deviceCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,CX=W/2,R=W/2-4;
  ctx.clearRect(0,0,W,W);
  ctx.save();ctx.translate(CX,CX);
  drawBg(ctx,R);

  const cal=getCalibratedHeading();
  const rot=cal!==null?-cal*Math.PI/180:0;
  ctx.save();ctx.rotate(rot);
  const wx=[
    {deg:180,span:72,c:'rgba(232,80,48,0.15)'},{deg:90,span:72,c:'rgba(56,184,72,0.15)'},
    {deg:0,span:72,c:'rgba(48,96,224,0.15)'},{deg:270,span:72,c:'rgba(144,192,224,0.15)'},
    {deg:45,span:18,c:'rgba(200,152,32,0.12)'},{deg:135,span:18,c:'rgba(200,152,32,0.12)'},
    {deg:225,span:18,c:'rgba(200,152,32,0.12)'},{deg:315,span:18,c:'rgba(200,152,32,0.12)'},
  ];
  for(const s of wx){sectorPath(ctx,s.deg,s.span/2,0,R*0.86);ctx.fillStyle=s.c;ctx.fill();}
  // 目標吉方扇形（整宮 45°）
  const ji=jiFangList[selectedJiIdx];
  if(ji){
    sectorPath(ctx,ji.deg,22.5,R*0.20,R*0.86);
    ctx.globalAlpha=0.35;ctx.fillStyle=ji.color;ctx.fill();
    ctx.globalAlpha=0.9;ctx.strokeStyle=ji.color;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
  }
  drawPalaceLines(ctx,R,R*0.20);
  drawTicks(ctx,R);
  drawRings(ctx,R);
  drawDirs(ctx,R,rot);
  ctx.restore();

  // 固定指標：手機朝向（畫面正上方）
  ctx.save();
  ctx.shadowColor='#e85030';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,-R*0.97);ctx.lineTo(-R*0.06,-R*0.80);ctx.lineTo(R*0.06,-R*0.80);ctx.closePath();
  ctx.fillStyle='#e85030';ctx.fill();
  ctx.shadowBlur=0;ctx.restore();

  drawTaiji(ctx,R);
  if(!compassActive||cal===null){
    ctx.font=`${R*0.09}px 'Noto Serif TC',serif`;
    ctx.fillStyle='rgba(160,152,124,0.6)';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(compassActive?'等待資料':'開啟感應器',0,R*0.30);
  }
  ctx.restore();
}

// ════════════════════════════════════════
//  吉方羅盤：固定坎北在上，紅線 = 目前手機朝向
// ════════════════════════════════════════
function drawJiCompass(){
  const canvas=document.getElementById('jiCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,CX=W/2,R=W/2-4;
  ctx.clearRect(0,0,W,W);
  ctx.save();ctx.translate(CX,CX);
  drawBg(ctx,R);
  const rot=0;

  jiFangList.forEach((ji,i)=>{
    const sel=i===selectedJiIdx;
    sectorPath(ctx,ji.deg,22.5,R*0.38,R*0.86);
    let alpha=ji.jiRank>=0?(0.22-ji.jiRank*0.04):0.08;
    if(ji.isKong)alpha=0.06;
    if(sel)alpha=Math.min(alpha*2.5,0.55);
    ctx.globalAlpha=alpha;ctx.fillStyle=ji.color;ctx.fill();ctx.globalAlpha=1;
    if(sel){ctx.strokeStyle=ji.color;ctx.lineWidth=2;ctx.globalAlpha=0.8;ctx.stroke();ctx.globalAlpha=1;}
  });
  drawPalaceLines(ctx,R,R*0.38);
  drawTicks(ctx,R);
  drawRings(ctx,R);

  jiFangList.forEach((ji,i)=>{
    const a=ji.deg*Math.PI/180,sel=i===selectedJiIdx;
    ctx.save();ctx.rotate(a);ctx.translate(0,-R*0.62);ctx.rotate(-a-rot);
    ctx.font=`700 ${R*0.076}px 'Noto Serif TC',serif`;
    ctx.fillStyle=ji.isKong?'rgba(160,80,80,0.75)':ji.color;
    ctx.globalAlpha=sel?1:0.75;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ji.door.replace('門',''),0,-R*0.035);
    if(ji.isKong){ctx.font=`${R*0.055}px serif`;ctx.fillStyle='rgba(176,48,48,0.9)';ctx.fillText('空',0,R*0.065);}
    ctx.globalAlpha=1;ctx.restore();
  });
  drawDirs(ctx,R,rot);

  const ji=jiFangList[selectedJiIdx];
  if(ji){
    const a=ji.deg*Math.PI/180,tx=Math.sin(a)*R*0.50,ty=-Math.cos(a)*R*0.50;
    ctx.save();ctx.shadowColor=ji.color;ctx.shadowBlur=Math.round(R*0.1);
    ctx.beginPath();ctx.arc(tx,ty,R*0.075,0,Math.PI*2);
    ctx.fillStyle=ji.color;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.font=`700 ${R*0.07}px 'Noto Serif TC',serif`;ctx.fillStyle='#fff';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',tx,ty);ctx.restore();
  }
  // 目前朝向
  const cal=getCalibratedHeading();
  if(cal!==null){
    const a=cal*Math.PI/180;
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(0,-R*0.16);ctx.lineTo(0,-R*0.95);
    ctx.strokeStyle='#e85030';ctx.lineWidth=2;ctx.shadowColor='#e85030';ctx.shadowBlur=8;ctx.stroke();
    ctx.restore();
  }
  drawTaiji(ctx,R);
  ctx.restore();
}

// ── 主循環：低通平滑（走最短角度）
function drawCompass(){
  if(rawHeading!==null&&deviceHeading!==null)
    deviceHeading=norm360(deviceHeading+angDiff(rawHeading,deviceHeading)*0.18);
  drawDeviceCompass();
  drawJiCompass();
  updateDiffArrow();
  if(compassActive) rafId=requestAnimationFrame(drawCompass);
}

function updateDiffBearing(){updateDiffArrow();}

// 偏差提示：整宮 ±22.5° 都算該方位；正中 ±5° 為「正對」
function updateDiffArrow(){
  const cal=getCalibratedHeading();
  const hint=document.getElementById('diffHint');
  if(cal===null||jiFangList.length===0){hint.style.opacity='0.4';return;}
  const p=palOf(cal);
  document.getElementById('deviceBearing').textContent=`${Math.round(cal)}° ${shanOf(cal)}山`;
  const diff=angDiff(targetDeg,cal);
  const arrow=document.getElementById('diffArrow');
  arrow.style.transform=`rotate(${Math.max(-150,Math.min(150,diff))}deg)`;
  const ad=Math.abs(Math.round(diff));
  const inRange=Math.abs(diff)<=22.5;
  const ji=jiFangList[selectedJiIdx];
  let t;
  if(ad<=5)t='✓ 正對'+PDIR[ji.pal];
  else if(inRange)t=`✓ 已在${PDIR[ji.pal]}範圍・${diff>0?'右':'左'}轉 ${ad}° 到正中`;
  else t=`${diff>0?'右轉':'左轉'} ${ad}°`;
  document.getElementById('diffBearing').textContent=t;
  document.getElementById('diffLabel').textContent=`目前面向 ${PDIR[p]}・${shanOf(cal)}山・${curBoard?.hmp?.[p]||''}`;
  hint.style.opacity='1';
  hint.classList.toggle('in-range',inRange);
  if(inRange&&!lastInRange&&navigator.vibrate)navigator.vibrate(40);
  lastInRange=inRange;
}

const HIST_KEY='qimen_history';
const HIST_MAX=30;

function saveHistory(R, question, guideJson){
  try{
    const hist=loadHistory();
    const entry={
      id: Date.now(),
      ts: new Date().toISOString(),
      question,
      dun:R.dun, ju:R.ju, jieqi:R.jieqi, yuan:R.yuan,
      dayGZ:R.dayGZ.gz,
      cat:curAnalysis?.cat, verdict:curAnalysis?.verdict, score:curAnalysis?.score,
      guide: guideJson,
    };
    hist.unshift(entry);
    if(hist.length>HIST_MAX) hist.length=HIST_MAX;
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }catch(e){console.warn('歷史儲存失敗',e);}
}

function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }
  catch(e){ return []; }
}

function renderHistoryPanel(){
  const hist=loadHistory();

  if(!hist.length){
    panel.innerHTML='<div class="hist-empty">尚無問卦紀錄</div>';return;
  }
  panel.innerHTML=hist.map(h=>{
    const dt=new Date(h.ts);
    const dtStr=`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
    const lv=h.guide?.geju_level||'平';
    const lvCls=/吉/.test(lv)?'gj-ji':/凶/.test(lv)?'gj-xiong':'gj-ping';

// 均時差（分鐘）
function eqOfTime(dt){
  const N=Math.floor((dt-new Date(dt.getFullYear(),0,0))/864e5);
  const B=2*Math.PI*(N-81)/364;
  return 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
}
function initSettings(){
  const bind=(id,key,isChk)=>{
    const el=document.getElementById(id);
    if(isChk)el.checked=!!SET[key];else el.value=SET[key];
    el.addEventListener('change',()=>{SET[key]=isChk?el.checked:(el.type==='number'&&key==='lon'?+el.value:el.value);saveSet();updSetSum();});
  };
  bind('sMethod','method');bind('sJi','ji');bind('sZi','zi');bind('sBirth','birth');bind('sTst','tst',true);bind('sLon','lon');
  updSetSum();
}
function updSetSum(){
  document.getElementById('setSum').textContent=[SET.method==='zhirun'?'置閏':'拆補',SET.ji==='kun'?'寄坤':'艮坤',
    SET.zi==='same'?'晚子不換日':'',SET.birth?'年命'+SET.birth:'',SET.tst?'真太陽時':''].filter(Boolean).join('・');
}
function setNow(){
  let n=new Date();
  if(SET.tst)n=new Date(n.getTime()+((+SET.lon||120)-120)*4*60000+eqOfTime(n)*60000);
  const late=n.getHours()>=23;
  if(late&&SET.zi!=='same')n.setDate(n.getDate()+1);   // 23 點後為次日子時
  document.getElementById('inYear').value=n.getFullYear();
  document.getElementById('inMonth').value=n.getMonth()+1;
  updDays();
  document.getElementById('inDay').value=n.getDate();
  const h=n.getHours();
  document.getElementById('inHour').value=late?(SET.zi==='same'?12:0):h<1?0:Math.floor((h+1)/2);
}

let curBoard=null;
const DOOR_MEAN={休門:'休養、求人、和談、宜靜',生門:'生財、置產、開創、謀利',傷門:'競爭、討債、捕獵，易有損傷',
  杜門:'隱藏、躲避、保密，事多阻塞',景門:'文書、考試、宣傳、表現',死門:'終結、停滯、弔喪，不宜動',
  驚門:'驚恐、口舌、官訟，宜防變',開門:'開業、求職、出行、見貴'};
const STAR_MEAN={蓬星:'膽大冒險，防盜失',任星:'穩重踏實，利守成',沖星:'行動快、性急',輔星:'文教、貴人扶持',
  英星:'名聲、光彩，易急躁',芮星:'問題暴露、疾病',柱星:'破壞、口舌是非',心星:'謀略、醫藥、管理',禽星:'中正、統籌'};
const GOD_MEAN={值符:'找有權位的貴人出面',螣蛇:'消息多變，口說無憑，重要事要落在紙上',太陰:'私下低調溝通，暗中佈局',
  六合:'適合合作、居中牽線、談和',白虎:'避免正面衝突，防意外',玄武:'防小人、看緊財物與文件',
  九地:'找穩重資深的人，宜守宜藏',九天:'主動出擊，向外拓展'};
const WX_COLOR_N={木:'綠、青色',火:'紅、紫色',土:'黃、咖啡色',金:'白色、金屬飾品',水:'黑、深藍色'};
const TONE={吉:'時機成熟，放手去做',小吉:'可以進行，留意細節',平:'穩紮穩打，按部就班',小凶:'阻力偏多，先守後攻',凶:'時機未到，宜緩宜守'};

function mainEval(A){return [...A.list,A.thing].find(o=>o.p===A.mainPal)?.ev||null;}

function localGuide(R,A,times){
  const ev=mainEval(A);
  const ge=(ev?ev.items:[]).filter(i=>GE_NOTE[i.label]&&Math.abs(i.v)>=1)   // 以用神宮的格局為主
    .sort((a,b)=>Math.abs(b.v)-Math.abs(a.v))[0];
  const fl=A.flags.find(f=>/伏吟|反吟|五不遇時/.test(f.label));
  const yq=yingQi(R,A,times);
  const geju=ge?ge.label:fl?fl.label.split('：')[0]:'普通盤';
  const lv=/吉/.test(A.verdict)?'吉':/凶/.test(A.verdict)?'凶':'平';
  const best=bestTimes(times);
  const bt=best.filter(t=>t!==times[0]).map(t=>`${t.label}（${t.dir}）`).join('、');
  let timing;
  if(lv==='吉')timing=`本時辰（${times[0]?.label}）即可行動。`+(bt?`其他好時段：${bt}。`:'');
  else timing=bt?`本時辰不宜，建議改在 ${bt}。`:'未來 12 時辰沒有明顯吉時，建議改日再起盤。';
  let location;
  const kong=A.mainPal&&R.kongPals.has(A.mainPal);
  if(ev&&ev.score>0&&!kong)location=`往${PDIR[A.mainPal]}（${A.mainName}所在，${ev.door}）。`;
  else{
    const alt=calcJiFang(R).find(j=>j.jiRank>=0&&!j.isKong);
    location=(A.mainPal?`${A.mainName}在${PDIR[A.mainPal]}${kong?'但旬空':'但力弱'}，`:'')+
      (alt?`改往${PDIR[alt.pal]}（${alt.door}）。`:'方位皆不理想，宜靜守。');
  }
  const people=ev?(GOD_MEAN[ev.god]||'以誠相待'):'以誠相待';
  const object=A.mainPal?`${WX_COLOR_N[PAL_WX[A.mainPal]]}（用神宮屬${PAL_WX[A.mainPal]}）`:'素色為宜';
  const pos=ev?ev.items.filter(i=>i.v>0).map(i=>i.label).join('、'):'';
  const neg=ev?ev.items.filter(i=>i.v<0).map(i=>i.label).join('、'):'';
  const summary=[pos&&`助力：${pos}`,neg&&`牽制：${neg}`,...A.flags.map(f=>f.label)].filter(Boolean).join('；')||'盤局平穩';
  if(yq.length)timing+=`<br>應期：${yq.slice(0,2).map(q=>q.t).join('；')}`;
  return{geju,geju_level:A.verdict,note:GE_NOTE[geju]||(fl?fl.label.split('：')[1]:''),tone:TONE[A.verdict],timing,location,people,object,ai_quote:summary};
}

function explainPalace(p){
  const R=curBoard;if(!R)return;
  const ev=evalPalace(R,p);
  const roles=curAnalysis?[...curAnalysis.list,curAnalysis.self,curAnalysis.thing].filter(o=>o.p===p).map(o=>o.n):[];
  const star=(ev.star||'').split('·')[0];
  const lines=[
    `<b>${PDIR[p]}（${p} 宮）</b>${roles.length?`　🎯 ${roles.join('、')}`:''}`,
    ev.door&&DOOR_MEAN[ev.door]?`🚪 ${ev.door}${ev.dst?'（'+ev.dst+'）':''}：${DOOR_MEAN[ev.door]}`:'',
    STAR_MEAN[star]?`⭐ ${ev.star}${ev.sst?'（'+ev.sst+'）':''}：${STAR_MEAN[star]}`:'',
    GOD_MEAN[ev.god]?`🛡 ${ev.god}：${GOD_MEAN[ev.god]}`:'',
    ev.hs?`☯ 天盤 ${ev.hs} 加 地盤 ${ev.es}${(()=>{const g=KEYING[ev.hs[0]+ev.es];return g?`：${g.n}，${g.note}`:'';})()}`:'',
    ev.items.length?`評分 ${ev.score>0?'+':''}${ev.score}：`+ev.items.map(i=>i.label+(i.v?`(${i.v>0?'+':''}${i.v})`:'')).join('、'):'',
  ].filter(Boolean);
  const area=document.getElementById('chatArea');area.classList.remove('hidden');
  area.innerHTML='';appendMsg('bot',lines.join('<br>'));
  area.scrollIntoView({behavior:'smooth',block:'nearest'});
}

const GEJU_DB={'青龍返首':{lv:'吉',icon:'🐉',note:'突破困境'},'飛鳥跌穴':{lv:'吉',icon:'🦅',note:'精準落點'},
  '白虎猖狂':{lv:'凶',icon:'🐅',note:'小心衝突'},'青龍逃走':{lv:'凶',icon:'🐉',note:'防破財人離'},'大格':{lv:'凶',icon:'⛔',note:'事難成'},'刑格':{lv:'凶',icon:'⚔',note:'防官非'},'伏宮格':{lv:'凶',icon:'🧱',note:'主客不利'},'飛宮格':{lv:'凶',icon:'🌀',note:'易變動'},'五不遇時':{lv:'凶',icon:'⚠',note:'時機未到'},'天網四張':{lv:'凶',icon:'🕸',note:'多重阻礙'},
  '伏吟':{lv:'凶',icon:'😶',note:'原地踏步'},
  '反吟':{lv:'凶',icon:'🔄',note:'方向需調整'},'普通盤':{lv:'平',icon:'☯',note:'穩紮穩打'}};

function renderGuideCard(json,R){
  const lv=json.geju_level||'平';
  const lvTag=/吉/.test(lv)?'gj-ji':/凶/.test(lv)?'gj-xiong':'gj-ping';
  const gjInfo=GEJU_DB[json.geju]||{lv,icon:'☯',note:''};
  document.getElementById('guideSlot').innerHTML=`
  <div class="guide-card">
    <div class="gc-header${R.dun==='陰遁'?' yin-header':''}">
      <div class="gc-badge">${gjInfo.icon||'☯'}</div>
      <div>
        <span class="gj-tag ${lvTag}">${lv}｜${json.geju}</span>
        <div class="gc-tone">${json.tone}</div>
        <div class="gc-format">${json.note??gjInfo.note??''}</div>
      </div>
    </div>
    <div class="gc-body">
      <div class="gc-item">
        <div class="gc-label"><span class="gc-label-icon">⏰</span>時機</div>
        <div class="gc-val">${json.timing}</div>
      </div>
      <div class="gc-item">
        <div class="gc-label"><span class="gc-label-icon">🧭</span>方位</div>
        <div class="gc-val">${json.location}</div>
      </div>
      <div class="gc-item">
        <div class="gc-label"><span class="gc-label-icon">🤝</span>人際</div>
        <div class="gc-val">${json.people}</div>
      </div>
      <div class="gc-item">
        <div class="gc-label"><span class="gc-label-icon">✨</span>物件</div>
        <div class="gc-val">${json.object}</div>
      </div>
    </div>
    <div class="gc-quote">${json.ai_quote}</div>
  </div>`;
}

function appendMsg(role,html){
  const area=document.getElementById('chatArea');
  const div=document.createElement('div');div.className=`msg ${role}`;
  div.innerHTML=`<div class="av">${role==='user'?'🙋':'🔮'}</div><div class="bubble">${html}</div>`;
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function fmtMD(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.+?)`/g,'<em>$1</em>').replace(/\n/g,'<br>');
}
